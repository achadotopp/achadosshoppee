<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">

<title>Achados da Shopee 🛍️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* CABEÇALHO */
header {
    background: #111;
    color: white;
    padding: 25px 15px;
    text-align: center;
    border-bottom: 5px solid #ff6500;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    color: #ddd;
}

/* CONTEÚDO */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 15px;
}

/* BUSCA */
.search {
    width: 100%;
    padding: 15px;
    border: 2px solid #ff6500;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    margin-bottom: 20px;
}

/* CATEGORIAS */
.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 25px;
    padding-bottom: 5px;
}

.categories button {
    background: #222;
    color: white;
    border: none;
    padding: 11px 17px;
    border-radius: 25px;
    cursor: pointer;
    white-space: nowrap;
    font-weight: bold;
}

.categories button:hover,
.categories button.active {
    background: #ff6500;
}

/* CONTADOR */
.count {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
}

/* PRODUTOS */
.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.product {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    transition: .2s;
    display: flex;
    flex-direction: column;
}

.product:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 22px rgba(0,0,0,.15);
}

.product-image {
    height: 150px;
    background: #fff0e6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
}

.product-info {
    padding: 15px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.category {
    font-size: 12px;
    color: #888;
    margin-bottom: 7px;
}

.product h2 {
    font-size: 16px;
    line-height: 1.35;
    margin-bottom: 10px;
}

.price {
    color: #ff5a00;
    font-size: 20px;
    font-weight: bold;
    margin-top: auto;
    margin-bottom: 12px;
}

.buy {
    display: block;
    background: #ff6500;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 12px;
    border-radius: 9px;
    font-weight: bold;
}

.buy:hover {
    background: #e95400;
}

/* RODAPÉ */
footer {
    margin-top: 40px;
    background: #111;
    color: #aaa;
    text-align: center;
    padding: 25px 15px;
}

footer strong {
    color: white;
}

/* CELULAR */
@media (max-width: 900px) {
    .products {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 650px) {
    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .product-image {
        height: 110px;
        font-size: 42px;
    }

    .product-info {
        padding: 11px;
    }

    .product h2 {
        font-size: 14px;
    }

    .price {
        font-size: 17px;
    }

    .buy {
        font-size: 13px;
        padding: 10px;
    }

    header h1 {
        font-size: 26px;
    }
}

@media (max-width: 380px) {
    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

let selectedCategory = "Todos";

function showProducts() {

    const search = document
        .getElementById("search")
        .value
        .toLowerCase();

    const container = document.getElementById("products");

    const filtered = products.filter(product => {

        const categoryMatch =
            selectedCategory === "Todos" ||
            product.category === selectedCategory;

        const searchMatch =
            product.name.toLowerCase().includes(search);

        return categoryMatch && searchMatch;

    });

    document.getElementById("count").innerText =
        filtered.length +
        (filtered.length === 1
        ? " produto encontrado"
        : " produtos encontrados");

    container.innerHTML = "";

    filtered.forEach(product => {

        const card = document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <div class="product-image">
                ${product.icon}
            </div>

            <div class="product-info">

                <div class="category">
                    ${product.category}
                </div>

                <h2>
                    ${product.name}
                </h2>

                <div class="price">
                    ${product.price}
                </div>

                <a
                    href="${product.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="buy"
                >
                    🛒 Comprar na Shopee
                </a>

            </div>
        `;

        container.appendChild(card);

    });

}

function filterCategory(category, button) {

    selectedCategory = category;

    document
        .querySelectorAll(".categories button")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");

    showProducts();
}

document
    .getElementById("search")
    .addEventListener("input", showProducts);

showProducts();
