<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Achados Shopee</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #ddd;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 25px;
    }

    .titulo h2 {
      margin-bottom: 8px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .vazio {
      background: white;
      border: 2px dashed #ddd;
      border-radius: 15px;
      padding: 45px 20px;
      text-align: center;
      grid-column: 1 / -1;
      color: #666;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 25px 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ Achados Shopee</h1>
    <p>Os melhores achadinhos em um só lugar!</p>
  </header>

  <main class="container">

    <section class="titulo">
      <h2>🔥 Achados da Shopee</h2>
      <p>Confira nossas ofertas e achadinhos!</p>
    </section>

    <section class="produtos">

      <!--
      ==================================================
      ÁREA DOS PRODUTOS

      Os produtos serão colocados aqui.

      Não coloque nada por enquanto.
      ==================================================
      -->

      <div class="vazio">
        <h3>📦 Nenhum produto disponível</h3>
        <p>Novos achadinhos serão adicionados em breve!</p>
      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 Achados Shopee</p>
  </footer>

</body>
</html>
